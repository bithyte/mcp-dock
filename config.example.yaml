public_url: https://mcp.example.com
listen: ":8080"
data_dir: /var/lib/mcp-dock

# Configure at least one login provider.
providers:
  github:
    client_id: Ov23liXXXXXXXXXXXXXX
    client_secret_env: GITHUB_CLIENT_SECRET
  # Any number of OpenID Connect providers. The name shows up in user ids,
  # allowlist keys and the callback URL (<public_url>/oauth/oidc/<name>/callback).
  oidc:
    - name: wallet
      label: Open Payments wallet
      issuer: https://oidc.example.com
      client_id: mcp-dock
      client_secret_env: WALLET_OIDC_SECRET
    # A company IdP that identifies people by verified email.
    # - name: corp
    #   issuer: https://login.corp.example
    #   client_id: mcp-dock
    #   client_secret_env: CORP_OIDC_SECRET
    #   user_claim: email
    #   scopes: [openid, email]

allowed_users:
  github:
    - alice-github-login
    - friend-login
  oidc:
    wallet:
      - https://ilp.interledger-test.dev/alice

upstreams:
  # Each upstream is a streamable HTTP MCP endpoint, usually an mcp-runner
  # container in front of a stdio server.
  - name: jaypost
    url: http://jaypost:8080/mcp
    # Optional: env var holding the runner's bearer token.
    bearer_token_env: JAYPOST_RUNNER_TOKEN
    deny_args:
      - attachment.path
