public_url: https://mcp.example.com
listen: ":8080"
data_dir: /var/lib/mcp-dock

# Configure at least one login provider.
providers:
  github:
    client_id: Ov23liXXXXXXXXXXXXXX
    client_secret_env: GITHUB_CLIENT_SECRET
  open_payments:
    wallet_address: https://ilp.interledger-test.dev/mcp
    key_id: mcp-dock-key
    # Env var holding an Ed25519 PKCS#8 private key, as PEM text or base64 of the PEM.
    private_key_env: OP_PRIVATE_KEY

allowed_users:
  github:
    - alice-github-login
    - friend-login
  open_payments:
    - $ilp.interledger-test.dev/alice

upstreams:
  # Each upstream is a streamable HTTP MCP endpoint, usually an mcp-runner
  # container in front of a stdio server.
  - name: jaypost
    url: http://jaypost:8080/mcp
    # Optional: env var holding the runner's bearer token.
    bearer_token_env: JAYPOST_RUNNER_TOKEN
    deny_args:
      - attachment.path
