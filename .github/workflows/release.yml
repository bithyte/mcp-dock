name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version X.Y.Z (no v prefix)
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "error: release must be dispatched from main, got $REF" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/check-release-version.sh "$VERSION"

      - run: go test ./...

      # A tag pushed with the default token doesn't trigger publish.yml's
      # tag trigger; the publish job below does the publishing.
      - name: Tag and push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "refs/tags/v$VERSION"

  publish:
    needs: tag
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
    permissions:
      contents: write
      packages: write
