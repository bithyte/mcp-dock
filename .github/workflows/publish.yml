name: publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_call:
    inputs:
      version:
        description: Version X.Y.Z (no v prefix)
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bithyte/mcp-dock
  IMAGE_RUNNER: ghcr.io/bithyte/mcp-runner

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Under workflow_call, github.ref_name is the caller's ref, so only
          # use it on the tag-push path (no input).
          if [ -n "$INPUT_VERSION" ]; then
            VERSION=$INPUT_VERSION
          else
            VERSION=${REF_NAME#v}
          fi
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: version '$VERSION' must match X.Y.Z" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MINOR=${VERSION%.*}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/v${{ env.VERSION }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - run: go test ./...

      - name: Build release binaries
        run: scripts/build-release-binaries.sh "$VERSION" dist

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --load can't load a multi-platform image, so test each platform
      # separately, then build both with --push (builder cache makes it cheap).
      # Both images are tested before either is pushed. The Dock image is
      # distroless, so these steps never exec a shell in it: they set
      # --entrypoint to the binary and inspect it from outside with docker cp.
      - name: Build and test amd64
        run: |
          docker buildx build --platform linux/amd64 --load -f Containerfile \
            --build-arg VERSION="$VERSION" -t mcp-dock:test-amd64 .
          CT=docker EXPECT_VERSION="$VERSION" scripts/test-image.sh mcp-dock:test-amd64

      - name: Build and check arm64
        run: |
          docker buildx build --platform linux/arm64 --load -f Containerfile \
            --build-arg VERSION="$VERSION" -t mcp-dock:test-arm64 .
          got=$(docker run --rm --platform linux/arm64 --entrypoint mcp-dock mcp-dock:test-arm64 version)
          if [ "$got" != "$VERSION" ]; then
            echo "error: arm64 image reports '$got', expected '$VERSION'" >&2
            exit 1
          fi
          # The run above proves nothing about GOARCH (a native amd64 binary
          # runs fine), so inspect the binary's build info too.
          tmp=$(mktemp -d)
          id=$(docker create --platform linux/arm64 mcp-dock:test-arm64)
          docker cp "$id:/usr/local/bin/mcp-dock" "$tmp/mcp-dock"
          docker rm "$id" >/dev/null
          if ! go version -m "$tmp/mcp-dock" | grep -qx $'\tbuild\tGOARCH=arm64'; then
            echo "error: arm64 image binary is not GOARCH=arm64" >&2
            go version -m "$tmp/mcp-dock" >&2 || true
            exit 1
          fi

      - name: Build and test runner amd64
        run: |
          docker buildx build --platform linux/amd64 --load -f Containerfile.runner \
            --build-arg VERSION="$VERSION" -t mcp-runner:test-amd64 .
          CT=docker EXPECT_VERSION="$VERSION" scripts/test-runner-image.sh mcp-runner:test-amd64

      - name: Build and check runner arm64
        run: |
          docker buildx build --platform linux/arm64 --load -f Containerfile.runner \
            --build-arg VERSION="$VERSION" -t mcp-runner:test-arm64 .
          got=$(docker run --rm --platform linux/arm64 --entrypoint mcp-runner mcp-runner:test-arm64 -version)
          if [ "$got" != "$VERSION" ]; then
            echo "error: arm64 runner image reports '$got', expected '$VERSION'" >&2
            exit 1
          fi
          # As for the Dock: the run proves nothing about GOARCH, and the image
          # has no go toolchain, so copy the binary out and inspect it here.
          tmp=$(mktemp -d)
          id=$(docker create --platform linux/arm64 mcp-runner:test-arm64)
          docker cp "$id:/usr/local/bin/mcp-runner" "$tmp/mcp-runner"
          docker rm "$id" >/dev/null
          if ! go version -m "$tmp/mcp-runner" | grep -qx $'\tbuild\tGOARCH=arm64'; then
            echo "error: arm64 runner image binary is not GOARCH=arm64" >&2
            go version -m "$tmp/mcp-runner" >&2 || true
            exit 1
          fi

      - name: Push multi-arch image
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push -f Containerfile \
            --build-arg VERSION="$VERSION" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:$MINOR" -t "$IMAGE:latest" .

      - name: Push multi-arch runner image
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push -f Containerfile.runner \
            --build-arg VERSION="$VERSION" \
            -t "$IMAGE_RUNNER:$VERSION" -t "$IMAGE_RUNNER:$MINOR" -t "$IMAGE_RUNNER:latest" .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          runner_digest=$(docker buildx imagetools inspect "$IMAGE_RUNNER:$VERSION" --format '{{.Manifest.Digest}}')
          if [ -z "$digest" ] || [ -z "$runner_digest" ]; then
            echo "error: could not read image digests" >&2
            exit 1
          fi
          # --notes is prepended to the generated notes.
          gh release create "v$VERSION" dist/* --verify-tag --generate-notes \
            --notes "Images: \`$IMAGE:$VERSION\`, digest \`$digest\`; \`$IMAGE_RUNNER:$VERSION\`, digest \`$runner_digest\`"
